<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>隔离舱检疫台 · 登录</title>
  <link rel="stylesheet" href="/static/css/quarantine.css" />
</head>
<body class="login-body">
  <main class="login-card">
    <h1>抓取隔离舱检疫台</h1>
    <p class="muted">数据工程 · 采集检疫控制台</p>
    <label>用户名<input id="user" value="admin" autocomplete="username" /></label>
    <label>密码<input id="pass" type="password" value="123456" autocomplete="current-password" /></label>
    <button id="btn">登录</button>
    <p id="err" class="err"></p>
  </main>
  <script>
    document.getElementById('btn').onclick = async () => {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({
          username: document.getElementById('user').value,
          password: document.getElementById('pass').value
        })
      });
      const j = await r.json();
      if (!r.ok) { document.getElementById('err').textContent = j.error || '登录失败'; return; }
      location.href = '/app';
    };
  </script>
</body>
</html>

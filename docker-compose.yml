services:
  quarantine-lab:
    build: .
    container_name: cc-quarantine-lab-quarantine-bug-15
    ports:
      - "7535:7500"
    environment:
      HOST: "0.0.0.0"
      PORT: "7500"
      DATABASE_PATH: /app/instance/quarantine_lab.db
    volumes:
      - quarantine_lab_data:/app/instance
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7500/login', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
volumes:
  quarantine_lab_data:
